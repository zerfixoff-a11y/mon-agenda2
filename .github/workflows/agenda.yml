# =====================================================================
#  Mon agenda : application installable (PWA), publiee avec GitHub Pages
#  Fichier a placer dans : .github/workflows/agenda.yml
#  Ensuite : Settings > Pages > Source = "GitHub Actions"
# =====================================================================
name: Publier mon agenda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Creer l'application
        run: |
          mkdir -p site && cd site
          cat > index.html <<'AGENDA_HTML_EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="robots" content="noindex, nofollow">
          <title>Mon agenda</title>
          <link rel="manifest" href="manifest.webmanifest">
          <meta name="theme-color" content="#173B47">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="Agenda">
          <link rel="icon" href="icon-192.png">
          <link rel="apple-touch-icon" href="apple-touch-icon.png">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#F3F6F8;--card:#fff;--ink:#1B2733;--muted:#5E6E7C;--line:#DCE3E9;--med:#C2415A;--perso:#1F7A8C;--travail:#B7791F;--accent:#1F7A8C;--onaccent:#fff;--medbg:#FBE9ED;--persobg:#E3F2F5;--travailbg:#FAF0DC;--side:#173B47;--sideink:#E8F1F4;color-scheme:light}
          @media (prefers-color-scheme:dark){:root{--bg:#10181F;--card:#18232C;--ink:#E7EDF2;--muted:#9AAAB8;--line:#2A3A47;--med:#F08AA0;--perso:#6CC4D4;--travail:#E8B75E;--accent:#6CC4D4;--onaccent:#0b1419;--medbg:#3A1E27;--persobg:#173039;--travailbg:#3A2F17;--side:#0B1217;color-scheme:dark}}
          *{box-sizing:border-box}
          [hidden]{display:none!important}
          body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
          button,input,select,textarea{font:inherit;color:inherit}
          h2.page{font-size:1.9rem;margin:0}h3{font-size:1.25rem;margin:26px 0 10px}
          .sub{color:var(--muted);margin:2px 0 0}
          .btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;cursor:pointer;min-height:46px}
          .btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
          .btn.danger{color:var(--med)}
          :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
          .side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--side);color:var(--sideink);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:20;transition:transform .25s}
          .side h1{font-size:1.35rem;margin:4px 10px 14px}
          .side button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px;border-radius:10px;font-size:1.05rem;cursor:pointer;min-height:50px}
          .side button:hover{background:rgba(255,255,255,.1)}
          .side button[aria-current="page"]{background:rgba(255,255,255,.18);font-weight:700}
          .badge{margin-left:auto;background:var(--med);color:#fff;border-radius:999px;font-size:.85rem;padding:0 9px}
          #inst{margin-top:auto;border:1px solid rgba(255,255,255,.35)}
          .top{display:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
          main{margin-left:250px;padding:28px 24px 70px;max-width:1010px}
          @media (max-width:860px){
           .side{transform:translateX(-105%)}.side.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
           .top{display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;z-index:15;background:var(--side);color:var(--sideink);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
           .top .btn{background:rgba(255,255,255,.12);color:inherit;border-color:transparent}
           main{margin-left:0;padding:calc(82px + env(safe-area-inset-top,0px)) 14px 70px}}
          .list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
          .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
          .item.ev{border-left:6px solid var(--perso);background:var(--persobg)}
          .ev.medical{border-left-color:var(--med);background:var(--medbg)}.ev.travail{border-left-color:var(--travail);background:var(--travailbg)}
          .when{font-weight:700}
          .ttl{display:flex;gap:10px;align-items:center;font-size:1.12rem}.ttl input{width:28px;height:28px;min-height:0}
          .done{text-decoration:line-through;color:var(--muted)}
          .meta{color:var(--muted)}.meta b{color:var(--ink)}
          .where{color:var(--ink);background:var(--travailbg);border-radius:8px;padding:6px 10px;margin:6px 0;display:inline-block}
          .notes{white-space:pre-wrap;margin:6px 0 0}
          .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
          .row button{border:0;background:none;text-decoration:underline;color:var(--accent);cursor:pointer;padding:6px 0;min-height:42px}
          .tag{font-size:.9rem;color:var(--muted);margin-top:6px}
          .empty{color:var(--muted);padding:10px 2px}
          .note-box{background:var(--travailbg);border:1px solid var(--travail);border-radius:12px;padding:14px 16px;margin:16px 0}
          .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px}.head h3,.head h2{margin:0}
          .quick{display:flex;gap:8px;flex-wrap:wrap}
          .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
          .panel .btn{margin:4px 6px 4px 0}
          .bigin{width:100%;font-size:1.2rem;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin-top:14px}
          .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
          .chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
          .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
          .cn{display:flex;gap:6px}.cn .btn{padding:6px 12px;min-height:42px}
          .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
          .dow{font-size:.85rem;color:var(--muted);text-align:center}
          .day{aspect-ratio:1/1;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 2px;gap:3px}
          .day:hover{background:var(--bg)}.day.out{opacity:.45}.day.today{border-color:var(--accent);font-weight:700}
          .day.sel{background:var(--accent);color:var(--onaccent)}
          .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
          .dot{width:8px;height:8px;border-radius:50%;background:var(--perso);display:inline-block}.dot.medical{background:var(--med)}.dot.travail{background:var(--travail)}
          .day.sel .dot{box-shadow:0 0 0 1.5px #fff}
          .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.92rem;color:var(--muted)}
          dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(500px,calc(100vw - 20px));max-height:92vh}
          dialog::backdrop{background:rgba(10,20,28,.55)}
          #fields{display:grid;gap:12px;margin:12px 0}
          label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
          label input,label select,label textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-weight:400;min-height:46px;width:100%}
          label .sub{font-weight:400;font-size:.9rem}
          .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
          #vwc img{max-width:100%}#vwc iframe{width:100%;height:60vh;border:0}
          .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
          .toast.show{opacity:1}
          @media print{.side,.top,.row,.quick,.btn,.cn,.chips,.scrim{display:none!important}main{margin:0;padding:0}body{background:#fff;color:#000}}
          @media (prefers-reduced-motion:reduce){*{transition:none!important}}
          </style>
          </head>
          <body>
          <div class="top"><button class="btn" id="menu" aria-label="Ouvrir le menu" aria-expanded="false">☰ Menu</button><strong>Mon agenda</strong></div>
          <div class="scrim" id="scrim" hidden></div>
          <aside class="side" id="side"><h1>Mon agenda</h1><nav id="nav"></nav><button id="inst" hidden>⬇️ Installer l’application</button></aside>
          <main id="main"></main>

          <dialog id="dlg"><form id="form" method="dialog">
            <h2 id="dt"></h2><div id="fields"></div>
            <div class="actions"><button type="button" class="btn danger" id="del" hidden>Supprimer</button><button type="button" class="btn" id="cancel">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
          </form></dialog>
          <dialog id="vw"><div id="vwc"></div><div class="actions" style="margin-top:12px"><a class="btn" id="vwa" target="_blank" rel="noopener">Ouvrir à part</a><button class="btn primary" id="vwx">Fermer</button></div></dialog>
          <input type="file" id="imp" accept="application/json" hidden>
          <div class="toast" id="toast" role="status"></div>

          <script>
          (function(){"use strict";
          var K1="mon-agenda-v1",K2="agenda-data-v2",K3="agenda-rappels-v1";
          var CAT={medical:"Médical",perso:"Personnel",travail:"Travail"};
          var DOC={ordonnance:"Ordonnance",resultat:"Résultats, analyses",assurance:"Mutuelle, Sécu",courrier:"Courrier",facture:"Facture",autre:"Autre"};
          var S={
           rdv:{n:"rendez-vous",f:[["title","Titre","text","Ex. : Dentiste, Dr Martin"],["date","Date","date"],["time","Heure","time"],["cat","Catégorie","select",CAT],["place","Lieu ou médecin","text","Adresse, cabinet, téléphone…"],["notes","Notes","textarea","Ordonnance à apporter, être à jeun…"]]},
           meds:{n:"traitement",f:[["title","Médicament","text","Nom du médicament"],["dose","Combien et quand","text","Ex. : 1 comprimé le matin"],["by","Prescrit par","text"],["notes","Notes","textarea"]]},
           contacts:{n:"contact",f:[["title","Nom","text","Dr Martin, pharmacie…"],["role","Rôle","text","Cardiologue, infirmière…"],["tel","Téléphone","tel"],["place","Adresse","text"],["notes","Notes","textarea"]]},
           docs:{n:"document",f:[["title","Nom du document","text","Ex. : Ordonnance du 12 mars"],["cat","Type","select",DOC],["place","Où est le papier ?","text","Ex. : classeur bleu, tiroir du salon"],["file","Photo ou PDF du document","file"],["notes","Notes","textarea"]]},
           notes:{n:"note",f:[["title","Titre","text"],["notes","Note","textarea"]]},
           todo:{n:"tâche",f:[["title","À faire","text","Ex. : Appeler la mutuelle"],["date","Pour le","date"]]}
          };
          var LAB={rdv:"Rendez-vous",meds:"Médical : traitement",contacts:"Médical : contact",docs:"Document",notes:"Note",todo:"À faire"};
          var NAV=[["accueil","🏠","Accueil"],["rdv","📅","Rendez-vous"],["medical","💊","Médical"],["documents","📄","Documents"],["notes","📝","Notes"],["todo","✅","À faire"],["chercher","🔍","Chercher"],["reglages","⚙️","Sauvegarde"]];
          var db={rdv:[],meds:[],contacts:[],docs:[],notes:[],todo:[]};
          var view="accueil",cur=new Date(),sel=null,flt="all",edit=null,deferred=null;
          var $=function(i){return document.getElementById(i)};
          function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
          function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
          function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2800)}
          function rd(k,d){try{var r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}
          function load(){var a=rd(K1,[]),o=rd(K2,{});Object.keys(db).forEach(function(k){db[k]=k==="rdv"?(Array.isArray(a)?a:[]):(Array.isArray(o[k])?o[k]:[])})}
          function save(){try{localStorage.setItem(K1,JSON.stringify(db.rdv));var o={};Object.keys(db).forEach(function(k){if(k!=="rdv")o[k]=db[k]});localStorage.setItem(K2,JSON.stringify(o))}catch(e){toast("Impossible d’enregistrer sur cet appareil.")}}
          /* dates */
          function pad(n){return String(n).padStart(2,"0")}
          function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
          function P(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
          function fmt(s,sh){return P(s).toLocaleDateString("fr-FR",sh?{weekday:"short",day:"numeric",month:"short"}:{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
          function until(s){var t=new Date();t.setHours(0,0,0,0);return Math.round((P(s)-t)/864e5)}
          function when(e){var n=until(e.date);return(n===0?"Aujourd’hui":n===1?"Demain":fmt(e.date))+(e.time?" à "+e.time:"")}
          function byDate(a,b){return(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))}
          /* fichiers (IndexedDB) */
          function idb(){return new Promise(function(ok,ko){var r=indexedDB.open("agenda-files",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){ok(r.result)};r.onerror=ko})}
          function tx(m,fn){return idb().then(function(d){return new Promise(function(ok,ko){var t=d.transaction("f",m),q=fn(t.objectStore("f"));t.oncomplete=function(){ok(q&&q.result)};t.onerror=ko})})}
          function fput(id,v){return tx("readwrite",function(s){s.put(v,id)})}
          function fget(id){return tx("readonly",function(s){return s.get(id)})}
          function fdel(id){return tx("readwrite",function(s){s.delete(id)}).catch(function(){})}
          function fall(){return tx("readonly",function(s){return s.getAllKeys()}).then(function(ks){return tx("readonly",function(s){return s.getAll()}).then(function(vs){var o={};ks.forEach(function(k,i){o[k]=vs[i]});return o})})}
          function readFile(f){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){
           if(f.type.indexOf("image/")!==0)return ok({name:f.name,type:f.type,data:r.result});
           var im=new Image();im.onerror=ko;im.onload=function(){var sc=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok({name:f.name,type:"image/jpeg",data:c.toDataURL("image/jpeg",.82)})};im.src=r.result};r.readAsDataURL(f)})}
          function showFile(id){fget(id).then(function(o){if(!o){toast("Fichier introuvable.");return}
           fetch(o.data).then(function(r){return r.blob()}).then(function(b){var u=URL.createObjectURL(b);
            $("vwc").innerHTML=o.type.indexOf("image/")===0?'<img src="'+u+'" alt="Document">':'<iframe src="'+u+'" title="Document"></iframe>';
            $("vwa").href=u;$("vw").showModal()})})}
          /* cartes */
          function evCard(e){return'<li class="item ev '+esc(e.cat)+'"><div class="when">'+esc(when(e))+'</div><div class="ttl"><strong>'+esc(e.title)+'</strong></div><div class="meta">'+esc(CAT[e.cat]||"")+(e.place?" – "+esc(e.place):"")+'</div>'+(e.notes?'<p class="notes">'+esc(e.notes)+'</p>':"")+'<div class="row"><button data-edit="rdv:'+esc(e.id)+'">Modifier</button><button data-ics="'+esc(e.id)+'">Ajouter au téléphone</button></div></li>'}
          function card(k,it){var h='<li class="item"><div class="ttl">'+(k==="todo"?'<input type="checkbox" data-toggle="'+esc(it.id)+'"'+(it.done?" checked":"")+' aria-label="Fait">':"")+'<strong'+(it.done?' class="done"':"")+'>'+esc(it.title)+'</strong></div>';
           S[k].f.forEach(function(f){var key=f[0],v=it[key];if(key==="title"||!v)return;
            if(f[2]==="textarea")h+='<p class="notes">'+esc(v)+'</p>';
            else if(f[2]==="file")h+='<div class="meta"><button class="btn" data-file="'+esc(it.id)+'">📎 Voir le document</button></div>';
            else{var s=f[2]==="select"?esc(f[3][v]||v):f[2]==="date"?esc(fmt(v,1)):f[2]==="tel"?'<a href="tel:'+esc(v)+'">'+esc(v)+'</a>':esc(v);
             h+='<div class="meta'+(key==="place"&&k==="docs"?" where":"")+'"><b>'+esc(f[1])+' :</b> '+s+'</div>'}});
           return h+'<div class="row"><button data-edit="'+k+':'+esc(it.id)+'">Modifier</button></div></li>'}
          function sect(k,title,empty){var it=db[k].slice().reverse();if(k==="todo")it.sort(function(a,b){return(a.done?1:0)-(b.done?1:0)});
           return'<div class="head"><h3>'+title+'</h3><button class="btn primary" data-add="'+k+'">+ Ajouter</button></div>'+(it.length?'<ul class="list">'+it.map(function(i){return card(k,i)}).join("")+'</ul>':'<p class="empty">'+empty+'</p>')}
          /* pages */
          function notifBox(){
           if(!("Notification" in window))return'<div class="note-box">Les rappels ne sont pas disponibles ici. Installez l’application sur l’écran d’accueil, ou ajoutez les rendez-vous au calendrier du téléphone (menu « Sauvegarde »).</div>';
           if(Notification.permission==="denied")return'<div class="note-box">Les notifications sont bloquées dans les réglages du téléphone ou du navigateur.</div>';
           if(Notification.permission==="default")return'<div class="note-box"><b>Être prévenu la veille d’un rendez-vous ?</b><br><button class="btn primary" data-act="notif">Activer les rappels</button></div>';
           return""}
          function vAccueil(){
           var up=db.rdv.filter(function(e){var n=until(e.date);return n>=0&&n<=7}).sort(byDate);
           var near=up.filter(function(e){return until(e.date)<=1}),wk=up.filter(function(e){return until(e.date)>1});
           var open=db.todo.filter(function(t){return!t.done}).length;
           var h='<h2 class="page">Bonjour</h2><p class="sub">'+esc(new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))+'</p>'+notifBox();
           h+='<h3>Aujourd’hui et demain</h3>'+(near.length?'<ul class="list">'+near.map(evCard).join("")+'</ul>':'<p class="empty">Rien de prévu aujourd’hui ni demain.</p>');
           if(wk.length)h+='<h3>Cette semaine</h3><ul class="list">'+wk.map(evCard).join("")+'</ul>';
           if(open)h+='<p><a href="#todo">'+open+(open>1?" choses à faire":" chose à faire")+'</a></p>';
           h+='<h3>Ajouter</h3><div class="quick">'+[["rdv","Rendez-vous"],["docs","Document"],["notes","Note"],["todo","Tâche"],["meds","Médicament"]].map(function(b){return'<button class="btn" data-add="'+b[0]+'">+ '+b[1]+'</button>'}).join("")+'</div>';
           return h}
          function vRdv(){
           var f=new Date(cur.getFullYear(),cur.getMonth(),1),st=new Date(f);st.setDate(1-(f.getDay()+6)%7);
           var by={},t=iso(new Date()),g="";
           db.rdv.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e)});
           "lun mar mer jeu ven sam dim".split(" ").forEach(function(d){g+='<div class="dow">'+d+'</div>'});
           for(var i=0;i<42;i++){var d=new Date(st);d.setDate(st.getDate()+i);var k=iso(d),ev=by[k]||[];
            g+='<button class="day'+(d.getMonth()!==cur.getMonth()?" out":"")+(k===t?" today":"")+(k===sel?" sel":"")+'" data-day="'+k+'" aria-label="'+esc(fmt(k)+(ev.length?", "+ev.length+" rendez-vous":""))+'"><span>'+d.getDate()+'</span>'+(ev.length?'<span class="dots">'+ev.slice(0,4).map(function(e){return'<i class="dot '+esc(e.cat)+'"></i>'}).join("")+'</span>':"")+'</button>'}
           var items=db.rdv.filter(function(e){return(flt==="all"||e.cat===flt)&&(sel?e.date===sel:e.date>=t)}).sort(byDate);
           var chips=[["all","Tout"],["medical","Médical"],["perso","Personnel"],["travail","Travail"]].map(function(c){return'<button class="chip" data-chip="'+c[0]+'" aria-pressed="'+(flt===c[0])+'">'+c[1]+'</button>'}).join("");
           return'<div class="head" style="margin-top:0"><h2 class="page">Rendez-vous</h2><button class="btn primary" data-add="rdv">+ Ajouter</button></div>'+
           '<div class="panel"><div class="head" style="margin-top:0"><h3 style="text-transform:capitalize">'+esc(cur.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))+'</h3><div class="cn"><button class="btn" data-act="prev" aria-label="Mois précédent">‹</button><button class="btn" data-act="today">Aujourd’hui</button><button class="btn" data-act="next" aria-label="Mois suivant">›</button></div></div><div class="grid">'+g+'</div><div class="legend"><span><i class="dot medical"></i> Médical</span><span><i class="dot"></i> Personnel</span><span><i class="dot travail"></i> Travail</span></div></div>'+
           '<h3>'+(sel?esc(fmt(sel)):"À venir")+'</h3><div class="chips">'+chips+'</div>'+(items.length?'<ul class="list">'+items.map(evCard).join("")+'</ul>':'<p class="empty">'+(sel?"Rien de prévu ce jour-là.":"Aucun rendez-vous à venir.")+'</p>')}
          function vMed(){return'<h2 class="page">Médical</h2>'+sect("meds","Traitements","Aucun traitement noté.")+sect("contacts","Médecins et contacts","Aucun contact noté.")}
          function vDocs(){return'<h2 class="page">Documents</h2><p class="sub">Prenez le papier en photo, et notez où vous l’avez rangé.</p>'+sect("docs","Mes documents","Aucun document pour l’instant.")}
          function vNotes(){return'<h2 class="page">Notes</h2>'+sect("notes","Mes notes","Aucune note.")}
          function vTodo(){return'<h2 class="page">À faire</h2>'+sect("todo","Ma liste","Rien à faire, bravo !")}
          function vSearch(){return'<h2 class="page">Chercher</h2><p class="sub">Un nom, un médecin, un endroit où un papier est rangé…</p><input id="q" type="search" class="bigin" placeholder="Tapez ici" autocomplete="off"><ul class="list" id="res" style="margin-top:14px"></ul>'}
          function doSearch(q){q=q.trim().toLowerCase();var out="";
           if(q)Object.keys(db).forEach(function(k){db[k].forEach(function(it){if(Object.keys(it).map(function(x){return it[x]}).join(" ").toLowerCase().indexOf(q)>-1)out+='<li class="tag">'+LAB[k]+'</li>'+(k==="rdv"?evCard(it):card(k,it))})});
           $("res").innerHTML=out||(q?'<li class="empty">Aucun résultat.</li>':"")}
          function vSet(){var ok="Notification" in window,p=ok?Notification.permission:"";
           return'<h2 class="page">Sauvegarde et réglages</h2>'+
           '<div class="panel"><h3 style="margin-top:0">Rappels</h3><p>Sur l’accueil, les rendez-vous d’aujourd’hui et de demain sont toujours en haut. '+(p==="granted"?'Les notifications sont activées : elles s’affichent quand vous ouvrez l’application.':'Activez les notifications pour recevoir un message à l’ouverture de l’application.')+'</p>'+(ok&&p==="default"?'<button class="btn primary" data-act="notif">Activer les rappels</button>':"")+
           '<p>Pour être prévenu même quand l’application est fermée, ajoutez les rendez-vous au calendrier du téléphone : il envoie lui-même les rappels (la veille et 2 heures avant).</p><button class="btn" data-ics="all">Ajouter les rendez-vous à venir au calendrier du téléphone</button></div>'+
           '<div class="panel"><h3 style="margin-top:0">Sauvegarde</h3><p>Tout est enregistré sur cet appareil, y compris les photos de documents. Faites une sauvegarde de temps en temps, et pour changer de téléphone.</p><button class="btn" data-act="export">Sauvegarder</button><button class="btn" data-act="import">Restaurer</button><button class="btn" data-act="print">Imprimer</button></div>'+
           (/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone?'<div class="panel">Pour installer l’application sur iPhone ou iPad : touchez Partager, puis « Sur l’écran d’accueil ».</div>':"")}
          var V={accueil:vAccueil,rdv:vRdv,medical:vMed,documents:vDocs,notes:vNotes,todo:vTodo,chercher:vSearch,reglages:vSet};
          function render(){
           var soon=db.rdv.filter(function(e){var n=until(e.date);return n===0||n===1}).length;
           $("nav").innerHTML=NAV.map(function(n){return'<button data-nav="'+n[0]+'"'+(n[0]===view?' aria-current="page"':"")+'><span aria-hidden="true">'+n[1]+'</span>'+n[2]+(n[0]==="rdv"&&soon?'<span class="badge">'+soon+'</span>':"")+'</button>'}).join("");
           $("main").innerHTML=V[view]();
           if(view==="chercher"){$("q").addEventListener("input",function(){doSearch(this.value)})}}
          function setView(v){if(!V[v])v="accueil";view=v;closeSide();render();window.scrollTo(0,0)}
          function closeSide(){$("side").classList.remove("open");$("scrim").hidden=true;$("menu").setAttribute("aria-expanded","false")}
          /* formulaire */
          function openForm(k,id){var it=id?db[k].filter(function(x){return x.id===id})[0]:null;edit={k:k,id:it?it.id:null};
           $("dt").textContent=(it?"Modifier : ":"Ajouter : ")+S[k].n;var h="";
           S[k].f.forEach(function(f){var key=f[0],v=it?(it[key]||""):(k==="rdv"&&key==="date"?(sel||iso(new Date())):(k==="rdv"&&key==="cat"?"medical":"")),i="f_"+key,inp;
            if(f[2]==="select")inp='<select id="'+i+'">'+Object.keys(f[3]).map(function(o){return'<option value="'+o+'"'+(o===v?" selected":"")+'>'+esc(f[3][o])+'</option>'}).join("")+'</select>';
            else if(f[2]==="textarea")inp='<textarea id="'+i+'" rows="3" placeholder="'+esc(f[3]||"")+'">'+esc(v)+'</textarea>';
            else if(f[2]==="file")inp='<input id="'+i+'" type="file" accept="image/*,application/pdf">'+(v?'<span class="sub">Un fichier est déjà enregistré. Choisissez-en un autre pour le remplacer.</span>':"");
            else inp='<input id="'+i+'" type="'+f[2]+'" value="'+esc(v)+'" placeholder="'+esc(f[3]||"")+'"'+(key==="title"||(key==="date"&&k==="rdv")?" required":"")+'>';
            h+='<label>'+esc(f[1])+inp+'</label>'});
           $("fields").innerHTML=h;$("del").hidden=!it;$("dlg").showModal()}
          $("form").addEventListener("submit",function(ev){ev.preventDefault();var k=edit.k,it,p=Promise.resolve();
           var o={};S[k].f.forEach(function(f){if(f[2]!=="file")o[f[0]]=$("f_"+f[0]).value.trim()});
           if(edit.id)it=db[k].filter(function(x){return x.id===edit.id})[0];else{it={id:uid()};db[k].push(it)}
           Object.assign(it,o);var fi=$("f_file");
           if(fi&&fi.files[0])p=readFile(fi.files[0]).then(function(r){it.file=r.name;return fput(it.id,r)});
           p.then(function(){save();$("dlg").close();render();toast("Enregistré.")}).catch(function(){toast("Fichier illisible ou trop gros.")})});
          $("cancel").onclick=function(){$("dlg").close()};
          $("del").onclick=function(){if(!confirm("Supprimer définitivement ?"))return;var k=edit.k,id=edit.id;db[k]=db[k].filter(function(x){return x.id!==id});fdel(id);save();$("dlg").close();render();toast("Supprimé.")};
          $("vwx").onclick=function(){$("vw").close()};
          $("vw").addEventListener("close",function(){$("vwc").innerHTML=""});
          /* calendrier du téléphone (.ics) */
          function dl(n,t,x){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000)}
          function ts(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"}
          function ie(s){return String(s||"").replace(/[\\;,]/g,"\\$&").replace(/\r?\n/g,"\\n")}
          function ics(list){var st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mon agenda//FR","CALSCALE:GREGORIAN"];
           list.forEach(function(e){var d=P(e.date);L.push("BEGIN:VEVENT","UID:"+e.id+"@mon-agenda","DTSTAMP:"+st);
            if(e.time){var h=e.time.split(":");d.setHours(+h[0],+h[1]);L.push("DTSTART:"+ts(d),"DTEND:"+ts(new Date(d.getTime()+36e5)))}
            else{var n=new Date(d);n.setDate(d.getDate()+1);L.push("DTSTART;VALUE=DATE:"+ts(d).slice(0,8),"DTEND;VALUE=DATE:"+ts(n).slice(0,8))}
            L.push("SUMMARY:"+ie(e.title));if(e.place)L.push("LOCATION:"+ie(e.place));if(e.notes)L.push("DESCRIPTION:"+ie(e.notes));
            (e.time?["-P1D","-PT2H"]:["-PT15H"]).forEach(function(t){L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+ie(e.title),"TRIGGER:"+t,"END:VALARM")});
            L.push("END:VEVENT")});
           L.push("END:VCALENDAR");return L.join("\r\n")}
          /* rappels */
          function remind(){if(!("Notification" in window)||Notification.permission!=="granted")return;
           var seen=rd(K3,{}),t=iso(new Date()),ch=0;
           Object.keys(seen).forEach(function(k){if(k.indexOf(t)!==0)delete seen[k]});
           db.rdv.forEach(function(e){var n=until(e.date);if(n!==0&&n!==1)return;var key=t+":"+e.id+":"+n;if(seen[key])return;seen[key]=1;ch=1;
            var ti=(n?"Demain : ":"Aujourd’hui : ")+e.title,op={body:(e.time?"à "+e.time:"")+(e.place?" – "+e.place:""),icon:"icon-192.png",tag:key};
            if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification(ti,op)});else new Notification(ti,op)});
           if(ch)try{localStorage.setItem(K3,JSON.stringify(seen))}catch(e){}}
          /* sauvegarde */
          function doExport(){fall().catch(function(){return{}}).then(function(f){dl("agenda-"+iso(new Date())+".json","application/json",JSON.stringify({v:2,db:db,files:f}))})}
          function doImport(file){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result),d=Array.isArray(o)?{rdv:o}:o.db,n=0;if(!d)throw 0;
            Object.keys(d).forEach(function(k){if(Array.isArray(d[k]))n+=d[k].length});
            if(!confirm("Remplacer tout le contenu actuel par cette sauvegarde ("+n+" éléments) ?"))return;
            Object.keys(db).forEach(function(k){db[k]=(Array.isArray(d[k])?d[k]:[]).filter(function(x){return x&&x.title&&(k!=="rdv"||x.date)}).map(function(x){x.id=String(x.id||uid());if(k==="rdv"&&!CAT[x.cat])x.cat="perso";return x})});
            var fs=o.files||{};save();Promise.all(Object.keys(fs).map(function(id){return fput(id,fs[id])})).catch(function(){}).then(function(){render();toast("Sauvegarde restaurée.")})
           }catch(e){toast("Fichier invalide.")}};r.readAsText(file)}
          /* événements */
          document.addEventListener("click",function(ev){
           var b=ev.target.closest("[data-nav],[data-add],[data-edit],[data-ics],[data-file],[data-day],[data-act],[data-chip]");if(!b)return;var d=b.dataset;
           if(d.nav){if(d.nav===view)closeSide();else location.hash=d.nav}
           else if(d.add)openForm(d.add);
           else if(d.edit){var p=d.edit.split(":");openForm(p[0],p.slice(1).join(":"))}
           else if(d.file)showFile(d.file);
           else if(d.chip){flt=d.chip;render()}
           else if(d.day){sel=sel===d.day?null:d.day;var x=P(d.day);if(x.getMonth()!==cur.getMonth())cur=new Date(x.getFullYear(),x.getMonth(),1);render()}
           else if(d.ics){var l=d.ics==="all"?db.rdv.filter(function(e){return until(e.date)>=0}):db.rdv.filter(function(e){return e.id===d.ics});
            if(!l.length)toast("Aucun rendez-vous à ajouter.");else{dl("rendez-vous.ics","text/calendar",ics(l));toast("Ouvrez le fichier pour l’ajouter au calendrier.")}}
           else if(d.act==="prev"||d.act==="next"){cur=new Date(cur.getFullYear(),cur.getMonth()+(d.act==="next"?1:-1),1);render()}
           else if(d.act==="today"){cur=new Date();sel=null;render()}
           else if(d.act==="notif")Notification.requestPermission().then(function(){remind();render()});
           else if(d.act==="export")doExport();
           else if(d.act==="import")$("imp").click();
           else if(d.act==="print")window.print()});
          document.addEventListener("change",function(ev){var t=ev.target;if(!t.dataset||!t.dataset.toggle)return;
           db.todo.forEach(function(x){if(x.id===t.dataset.toggle)x.done=t.checked});save();render()});
          $("imp").addEventListener("change",function(){if(this.files[0])doImport(this.files[0]);this.value=""});
          $("menu").onclick=function(){var o=$("side").classList.toggle("open");$("scrim").hidden=!o;this.setAttribute("aria-expanded",String(o))};
          $("scrim").onclick=closeSide;
          window.addEventListener("hashchange",function(){setView(location.hash.slice(1))});
          window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;$("inst").hidden=false});
          $("inst").onclick=function(){if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;$("inst").hidden=true})}};
          window.addEventListener("appinstalled",function(){$("inst").hidden=true});
          document.addEventListener("visibilitychange",function(){if(!document.hidden){remind();if(view==="accueil")render()}});
          setInterval(remind,300000);
          if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
          load();view=V[location.hash.slice(1)]?location.hash.slice(1):"accueil";render();remind();
          })();
          </script>
          </body>
          </html>
          AGENDA_HTML_EOF

          cat > manifest.webmanifest <<'MANIFEST_EOF'
          {
            "name": "Mon agenda",
            "short_name": "Agenda",
            "description": "Agenda et rendez-vous médicaux",
            "lang": "fr",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#F3F6F8",
            "theme_color": "#1F7A8C",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
          }
          MANIFEST_EOF

          cat > sw.js <<'SW_EOF'
          // Service worker : fonctionne hors ligne + clic sur une notification.
          const CACHE = "mon-agenda-v2";
          const FILES = ["./", "index.html", "manifest.webmanifest", "icon-192.png", "icon-512.png", "apple-touch-icon.png"];
          self.addEventListener("install", e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(FILES)).then(() => self.skipWaiting()));
          });
          self.addEventListener("activate", e => {
            e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
          });
          self.addEventListener("fetch", e => {
            if (e.request.method !== "GET") return;
            if (new URL(e.request.url).origin !== location.origin) return;
            e.respondWith(
              fetch(e.request).then(r => { const c = r.clone(); caches.open(CACHE).then(x => x.put(e.request, c)); return r; })
                .catch(() => caches.match(e.request).then(r => r || caches.match("./")))
            );
          });
          self.addEventListener("notificationclick", e => {
            e.notification.close();
            e.waitUntil(clients.matchAll({ type: "window" }).then(l => l.length ? l[0].focus() : clients.openWindow("./#accueil")));
          });
          SW_EOF

          echo '' | base64 -d > icon-192.png
          echo '' | base64 -d > icon-512.png
          echo '' | base64 -d > apple-touch-icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
